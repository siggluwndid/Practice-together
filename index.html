<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발표 장려를 위한 상점 부여 사이트</title>
</head>
<body>
<div><h1>사이트 소개</h1>
<p>이 사이트은 학생들의 발표를 장려하기 위해 
   발표를 한다면 상점이 부여되는 간편하고 간단한 사이트입니다.</p></div>
<div>
    <input type="text", id = "name">
</div>


<button id="벌점">벌점 부여</button>
<button id="상점">상점 부여</button>

<BUtton>제출</BUtton>

<div>
    <b>주의</b>
<p>벌점이 일정 수준 이상일시 불리한 점이 있을 수 있습니다.</p>
<ul>
    <li>10w</li>
</ul>
<button id = "check">상벌점 조회</button>
<h3>당신의 벌점은 ${mijung}점 이고, 상점은 ${duksoon}점 입니다.</h3>
<h3>당신의 총점은 ${duksoon - mijung}점 입니다.</h3>
</div>
    
</body>
<script>
    const respones = fetch("example/api")
    const mijung = respones.jo
    const duksoon = respones.park

    if (mijung >= 20) {
        fetch("example/api/sundo", {
            method: 'POST',
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ 
                name : name,
                state : "sundo"
            })
        })
    }
    
    const name = document.getElementById("name").value;
</script>
</html>
